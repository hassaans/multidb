name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go mod tidy is clean
        run: |
          go mod tidy
          test -z "$(git status --porcelain -- go.mod go.sum)" || { git diff; exit 1; }
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - run: go build ./...
      # Tests start an embedded Postgres (downloaded once per run) unless MULTIDB_TEST_DSN is set.
      - run: go test -race -count=1 ./...
