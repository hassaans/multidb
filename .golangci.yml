version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - nolintlint
    - unconvert
  settings:
    errorlint:
      errorf: true
    errcheck:
      # Deferred rollback/close after an earlier error check is the idiom; nothing to do with the error.
      exclude-functions:
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (*github.com/jackc/pgx/v5.Conn).Close

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hassaans/multidb
